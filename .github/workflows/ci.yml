name: CI

# Gate for task 7: typecheck → public-dependency verify → build → worker-smoke →
# export-integrity → tool-smoke → live/client/confinement → pack-content verify →
# "install the tarball and boot it" smoke.
# Headless: the worker renders in a real browser it launches itself (no display).
# Ubuntu-latest ships DejaVu fonts, which satisfy the PDF/PNG guards; no CJK font
# install is required for gating (CJK glyph fidelity is verified on the dev
# machine / E2E checklist). export-integrity asks the worker which font families
# it registered and points the sheet at one of them before asserting that a font
# file was really embedded, so the assertion holds on any host with a font.
#
# The chain runs UNDER scripts/audit-browsers.mjs, which samples live engine
# browsers for the whole run and fails if any outlives it. The engine keeps a
# browser alive for as long as it serves, so an engine that never shuts down is
# a browser that never shuts down — a real window in the system window list, 15
# processes and 150-250 MB each — and that failure is only visible ACROSS test
# processes, which is why it is watched from outside them.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        # Build-script approvals for canvas/esbuild come from pnpm-workspace.yaml
        # (allowBuilds), which is committed with the repo.

      - name: Full verification chain
        run: node scripts/audit-browsers.mjs --max-concurrent=4 -- pnpm run ci

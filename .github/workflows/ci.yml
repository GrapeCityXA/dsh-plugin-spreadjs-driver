name: CI

# Verify host/client contracts, workbook creation, task lifecycle and the
# installable package through the same suite used before publication.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
        # Build-script approval for esbuild comes from pnpm-workspace.yaml.

      - name: Full verification chain
        run: pnpm run ci
